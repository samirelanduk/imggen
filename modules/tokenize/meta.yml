# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "tokenize"
description: Tokenize text using a CLIP tokenizer, producing padded token sequences and a token-to-string mapping
keywords:
  - tokenize
  - clip
  - nlp
  - text
  - transformers
tools:
  - transformers:
      description: State-of-the-art Machine Learning for PyTorch, TensorFlow, and JAX
      homepage: https://huggingface.co/docs/transformers
      documentation: https://huggingface.co/docs/transformers
      tool_dev_url: https://github.com/huggingface/transformers
      licence: ["Apache-2.0"]
  - clip:
      description: OpenAI CLIP (Contrastive Language-Image Pre-Training) tokenizer
      homepage: https://github.com/openai/CLIP
      licence: ["MIT"]
input:
  - text:
      type: file
      description: Plain text file to tokenize
      pattern: "*.{txt}"
  - clip_tokenizer:
      type: directory
      description: Directory containing a pretrained CLIPTokenizer (vocab.json, merges.txt, etc.)
output:
  - tokens:
      type: file
      description: |
        JSON file containing a list of token ID sequences, each of length 77
        (the CLIP max context length), with shorter final sequences padded.
      pattern: "tokens.json"
  - mapping:
      type: file
      description: |
        CSV file mapping each token string to its token ID, with sequences
        separated by blank rows.
      pattern: "mapping.csv"
authors:
  - "@samirelanduk"
maintainers:
  - "@samirelanduk"