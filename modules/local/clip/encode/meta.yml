# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "CLIP Encode"
description: Encode CLIP embeddings through transformer layers to produce final conditioning tensors for image generation
keywords:
  - encode
  - clip
  - transformer
  - attention
  - conditioning
tools:
  - pytorch:
      description: An open source machine learning framework
      homepage: https://pytorch.org
      documentation: https://pytorch.org/docs
      tool_dev_url: https://github.com/pytorch/pytorch
      licence: ["BSD-3-Clause"]
  - safetensors:
      description: Simple, safe way to store and distribute tensors
      homepage: https://huggingface.co/docs/safetensors
      tool_dev_url: https://github.com/huggingface/safetensors
      licence: ["Apache-2.0"]
  - clip:
      description: OpenAI CLIP (Contrastive Language-Image Pre-Training) model
      homepage: https://github.com/openai/CLIP
      licence: ["MIT"]
input:
  - embeddings:
      type: file
      description: PyTorch tensor file containing combined token and position embeddings (from CLIP embeddings step)
      pattern: "*.{pt}"
  - clip_model:
      type: file
      description: Pretrained CLIP model weights in safetensors format
      pattern: "*.{safetensors}"
output:
  conditioning:
    type: file
    description: |
      PyTorch tensor file containing the final conditioning output after
      passing embeddings through all CLIP transformer encoder layers and
      final layer normalization.
    pattern: "conditioning.pt"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | cut -d" " -f2:
          type: eval
          description: The expression to obtain the version of the tool
  versions_pytorch:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pytorch:
          type: string
          description: The tool name
      - python3 -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_safetensors:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - safetensors:
          type: string
          description: The tool name
      - python3 -c "import safetensors; print(safetensors.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - numpy:
          type: string
          description: The tool name
      - python3 -c "import numpy; print(numpy.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | cut -d" " -f2:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pytorch:
          type: string
          description: The tool name
      - python3 -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - safetensors:
          type: string
          description: The tool name
      - python3 -c "import safetensors; print(safetensors.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - numpy:
          type: string
          description: The tool name
      - python3 -c "import numpy; print(numpy.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
authors:
