# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "Blank Latent"
description: Create a blank latent tensor of zeros to be denoised via sampling
keywords:
  - latent
  - blank
  - diffusion
tools:
  - pytorch:
      description: An open source machine learning framework
      homepage: https://pytorch.org
      documentation: https://pytorch.org/docs
      tool_dev_url: https://github.com/pytorch/pytorch
      licence: ["BSD-3-Clause"]
input:
  - width:
      type: integer
      description: The width of the latent image in pixels (must be divisible by 8)
  - height:
      type: integer
      description: The height of the latent image in pixels (must be divisible by 8)
output:
  latent:
    type: file
    description: |
      PyTorch tensor file containing a blank latent of zeros
      with shape [1, 4, height/8, width/8].
    pattern: "latent.pt"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | cut -d" " -f2:
          type: eval
          description: The expression to obtain the version of the tool
  versions_pytorch:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pytorch:
          type: string
          description: The tool name
      - python3 -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | cut -d" " -f2:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pytorch:
          type: string
          description: The tool name
      - python3 -c "import torch; print(torch.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samirelanduk"
maintainers:
  - "@samirelanduk"
